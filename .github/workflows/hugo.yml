name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  # Lets the site be built and deployed from a branch before `main` is cut over.
  workflow_dispatch:

# Default for every job: read the repo and nothing more. `pages: write` and
# `id-token: write` are granted only to the deploy job that actually needs
# them, so a compromise in the build job -- the one that runs third-party
# actions and fetches a remote Hugo module -- cannot publish to Pages or mint
# an OIDC token.
permissions:
  contents: read

# Never let two deploys race; queue instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the Hugo used locally. The theme needs >= 0.146.
      # Standard edition is enough: the theme ships plain CSS, no SCSS.
      HUGO_VERSION: 0.164.0
      # sha256 of hugo_${HUGO_VERSION}_linux-amd64.deb. Deliberately hardcoded
      # rather than read from the release's own checksums.txt: a checksum
      # fetched from the same release proves nothing if that release is
      # tampered with. Pinning it here means swapping the asset breaks the
      # build. Update this whenever HUGO_VERSION changes.
      HUGO_DEB_SHA256: 06f51ad0ec83e399e08a46a960f32453c109d6aad93e51ff8e659cdd5e51be7b
    steps:
      - name: Install Hugo CLI
        run: |
          set -euo pipefail
          deb="${{ runner.temp }}/hugo.deb"
          wget -qO "$deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          # Verify before handing it to dpkg, which runs as root.
          echo "${HUGO_DEB_SHA256}  ${deb}" | sha256sum --check --strict -
          sudo dpkg -i "$deb"

      # All actions are pinned to full commit SHAs, not tags. Tags are mutable:
      # the tj-actions/changed-files compromise (CVE-2025-30066) retagged
      # existing versions to a commit that leaked runner secrets into public
      # build logs. A SHA cannot be moved under us. Bump these deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      # The theme is a Hugo Module, so `hugo` shells out to the Go toolchain.
      # Without this the build fails resolving the module.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow default. deploy-pages needs
    # exactly these two; it does no checkout, so contents is not granted.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
