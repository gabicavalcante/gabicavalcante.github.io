baseURL = "https://gabicavalcante.dev/"
title = "gabi cavalcante"
# `locale` replaces the languageCode key, deprecated in Hugo v0.158.0.
locale = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true

# Term pages are titled from the term itself, so without this Hugo title-cases
# them and `data-visualization` renders as `Data-Visualization`. Must stay at
# the top level -- putting it after [params] makes it a param, where nothing
# reads it.
capitalizeListTitles = false

# Declaring this replaces Hugo's defaults, which are tags AND categories.
# Nothing on the site sets a category, and the default left an empty
# /categories/ page in the build and the sitemap.
[taxonomies]
  tag = "tags"

# Theme is pulled in as a Hugo Module, pinned in go.mod / go.sum.
# Update with: hugo mod get -u github.com/mrmierzejewski/hugo-theme-console
[module]
  [[module.imports]]
    path = "github.com/mrmierzejewski/hugo-theme-console"

[markup]
  [markup.highlight]
    # Class-based, NOT inline. `noClasses = true` (Chroma's default) writes the
    # style's background-color inline on the <pre>, but terminal.css repaints
    # `pre code` with the page background -- so the highlight background
    # survived only in the <pre>'s padding and read as a thick dark frame
    # around a light code block. That is what monokai looked like here.
    #
    # With classes, colours come from assets/css/custom.css, which the theme
    # picks up on its own (see the `resources.Get "css/custom.css"` block in
    # the theme's baseof.html). That file deliberately ships NO background, so
    # the block keeps the theme's own background in both light and dark mode.
    # Regenerate it with `hugo gen chromastyles` -- see its header comment.
    noClasses = false

[params]
  # Read by layouts/_default/baseof.html. `description` is the fallback for the
  # meta description on pages that set none of their own -- the home page above
  # all, which has no summary to fall back to. `tagline` is appended to the
  # home page's title element only, so the one page whose title would otherwise
  # be the bare site name says what the site is about.
  description = "Gabi Cavalcante — full-stack engineer and tech lead in Brazil. Notes on Python, Django, Celery, PostgreSQL, and keeping platforms reliable."
  tagline = "Python, Django, and the platform around it"

  # The original site rendered the full site name, not the two-char mobile form.
  titleCutting = false
  animateStyle = "animated zoomIn fast"

  # Identity for the JSON-LD in partials/schema.html. Deliberately separate
  # from the linkedin/github cascade in content/posts/_index.md: that drives
  # the visible per-post links, while these are the sameAs profiles a search
  # engine uses to resolve the author as one entity across sites.
  #
  # Placement matters, for the same reason capitalizeListTitles has to stay at
  # the top level: a TOML table header captures every scalar key that follows
  # it. Declared above titleCutting/animateStyle, this swallowed both --
  # animateStyle became params.author.animateStyle and every page silently lost
  # the theme's load animation. Keep table headers below the scalars.
  [params.author]
    name = "Gabi Cavalcante"
    jobTitle = "Full-stack engineer and tech lead"
    sameAs = [
      "https://github.com/gabicavalcante",
      "https://www.linkedin.com/in/gabrielacavalcante/",
    ]

  [[params.navlinks]]
    name = "about/"
    url = "about/"

  [[params.navlinks]]
    name = "posts/"
    url = "posts/"

  [[params.navlinks]]
    name = "cv/"
    url = "cv/"
