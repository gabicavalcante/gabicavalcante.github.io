baseURL = "https://gabicavalcante.github.io/"
title = "gabi cavalcante"
# `locale` replaces the languageCode key, deprecated in Hugo v0.158.0.
locale = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true

# Theme is pulled in as a Hugo Module, pinned in go.mod / go.sum.
# Update with: hugo mod get -u github.com/mrmierzejewski/hugo-theme-console
[module]
  [[module.imports]]
    path = "github.com/mrmierzejewski/hugo-theme-console"

[markup]
  [markup.highlight]
    # Pinned to reproduce the original site's inline-styled code blocks.
    style = "monokai"
    noClasses = true

[params]
  # The original site rendered the full site name, not the two-char mobile form.
  titleCutting = false
  animateStyle = "animated zoomIn fast"

  [[params.navlinks]]
    name = "about/"
    url = "about/"

  [[params.navlinks]]
    name = "posts/"
    url = "posts/"

  [[params.navlinks]]
    name = "cv/"
    url = "cv/"
